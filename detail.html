<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Kalender Melawai</title><style>body{font:15px/1.45 system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 18px;color:#1f2937}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{border:1px solid #dbe2ea;padding:8px;text-align:left;vertical-align:top}th{background:#f1f5f9}.sit{color:#1d4ed8;font-weight:700}.uat{color:#15803d;font-weight:700}.old{color:#64748b;text-decoration:line-through;font-weight:400;margin-right:5px}a{color:#2563eb}.latest{white-space:nowrap}</style></head><body><h1>Detail SIT dan UAT Melawai Eye Care</h1><p id="meta">Memuat data terbaru...</p><p><a href="index.html">← Kembali ke kalender</a></p><p><strong>Keterangan:</strong> tanggal tercoret adalah jadwal lama yang sudah di-reschedule/re-UAT; tanggal tebal adalah tanggal terbaru.</p><table><thead><tr><th>Skenario</th><th>Sub Skenario</th><th>Tanggal SIT</th><th>Tanggal UAT</th><th>Prasyarat</th></tr></thead><tbody id="rows"></tbody></table><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=d=>d?new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeZone:'Asia/Jakarta'}).format(new Date(d+'T00:00:00+07:00')):'—';const dates=(all,current,cls)=>{const history=all|| (current?[current]:[]);return history.map((d,i)=>`<span class="${i===history.length-1?'latest':'old '+cls}">${date(d)}</span>`).join('')||'—'};fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('meta').innerHTML=`Last refresh: <b>${esc(d.refreshedAt.replace('T',' '))} WIB</b> · <a href="${esc(d.source)}" target="_blank" rel="noopener">Sumber Google Docs</a>`;document.getElementById('rows').innerHTML=d.rows.map(x=>`<tr><td>${esc(x.scenario)}</td><td>${esc(x.subScenario)}</td><td class="sit">${dates(x.sitDates,x.sitDate,'sit')}</td><td class="uat">${dates(x.uatDates,x.uatDate,'uat')}</td><td>${esc(x.prerequisite)||'—'}</td></tr>`).join('')});
</script></body></html>
