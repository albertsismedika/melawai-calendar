<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalender SIT dan UAT Melawai Eye Care</title>
<style>
:root{font:15px/1.45 system-ui,sans-serif;color:#1f2937}body{max-width:1180px;margin:28px auto;padding:0 16px;background:#f8fafc}h1{margin-bottom:4px}.meta{color:#64748b}.top-link,.summary-button{display:inline-block;background:#1d4ed8;color:#fff;padding:8px 12px;border:0;border-radius:6px;text-decoration:none;font:inherit;font-weight:700;cursor:pointer;margin-right:8px}.summary-button{background:#0f766e}.legend{display:flex;gap:18px;margin:18px 0}.dot{display:inline-block;border-radius:4px;color:#fff;padding:3px 8px;font-weight:700}.sit{background:#2563eb}.uat{background:#16a34a}.month{background:#fff;border:1px solid #dbe2ea;border-radius:10px;margin:18px 0;padding:16px;box-shadow:0 2px 8px #0f172a0b}.month h2{margin:0 0 12px;font-size:20px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-weight:700;color:#64748b;padding:5px;font-size:13px}.day{min-height:92px;border:1px solid #dbe2ea;border-radius:5px;background:#fff;padding:6px;text-align:left;cursor:pointer}.day:hover,.day.selected{outline:2px solid #94a3b8;outline-offset:-2px}.day.muted{background:#f8fafc;border-color:transparent;cursor:default}.day.today{border-color:#f59e0b}.num{font-weight:700}.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.badge{border-radius:3px;color:#fff;padding:2px 5px;font-size:12px;font-weight:700}.detail,.summary{background:#fff;border:1px solid #dbe2ea;border-radius:10px;padding:16px;margin:18px 0}.detail h2,.summary h2{margin:0 0 10px}.detail h3{font-size:15px;margin:12px 0 3px}.detail ul,.summary ul{margin:4px 0;padding-left:22px}.summary-date{border-top:1px solid #e2e8f0;padding:10px 0}.empty{color:#64748b;font-style:italic}a{color:#2563eb}@media(max-width:650px){.day{min-height:64px;padding:4px}.week div{font-size:11px}.badge{font-size:10px}.month{padding:8px}}
</style></head><body>
<h1>Kalender SIT dan UAT Melawai Eye Care</h1><p class="meta" id="meta">Memuat data terbaru...</p><p><a class="top-link" href="detail.html">Buka detail lengkap &rarr;</a><button class="summary-button" id="summary-button" type="button">Summary per tanggal</button> <a class="top-link" href="https://docs.google.com/document/d/1wXNFkmNGXnklR15dsUcCuufNT9E0C5b-pvDLa0vuC-g/edit?tab=t.0" target="_blank" rel="noopener">Materi Scope MEC</a></p>
<div class="legend"><span><b class="dot sit">SIT</b> System Integration Test</span><span><b class="dot uat">UAT</b> User Acceptance Test</span></div>
<main id="calendar"></main><section class="summary" id="summary" hidden></section><section class="detail" id="detail" hidden><h2>Pilih tanggal</h2><p class="empty">Klik tanggal yang memiliki jadwal untuk melihat detail aktivitas.</p></section>
<p><a href="detail.html">Lihat detail seluruh item</a></p>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
const monthFmt=new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function show(date,events){document.querySelectorAll('.day.selected').forEach(x=>x.classList.remove('selected'));const cell=document.querySelector(`[data-date="${date}"]`);if(cell)cell.classList.add('selected');const detail=document.getElementById('detail');detail.hidden=false;const e=events[date]||{SIT:[],UAT:[]};let html=`<h2>${fmt.format(new Date(date+'T00:00:00+07:00'))}</h2>`;for(const kind of ['SIT','UAT']){html+=`<h3><span class="badge ${kind.toLowerCase()}">${kind} (${e[kind].length})</span></h3>`;html+=e[kind].length?`<ul>${e[kind].map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul>`:'<div class="empty">Tidak ada jadwal</div>'}detail.innerHTML=html}
function renderSummary(events){const scopeLinks={'2026-09-16':'https://docs.google.com/spreadsheets/d/1kGnQwcT4dMNR98BH6-exnmTcb4uYDRwlD-mVFvRl_N4/edit?gid=1530802560#gid=1530802560','2026-09-18':'https://docs.google.com/spreadsheets/d/1kGnQwcT4dMNR98BH6-exnmTcb4uYDRwlD-mVFvRl_N4/edit?gid=1572048912#gid=1572048912','2026-09-23':'https://docs.google.com/spreadsheets/d/1kGnQwcT4dMNR98BH6-exnmTcb4uYDRwlD-mVFvRl_N4/edit?gid=1530802560#gid=1530802560'};const summary=document.getElementById('summary');summary.hidden=false;summary.innerHTML='<h2>Summary per tanggal</h2>'+Object.keys(events).sort().map(date=>{const e=events[date],link=scopeLinks[date]?`<a href="${esc(scopeLinks[date])}" target="_blank" rel="noopener">Link test case skenario</a>`:'';return `<div class="summary-date"><strong>${fmt.format(new Date(date+'T00:00:00+07:00'))}</strong> ${link}<div><span class="badge sit">SIT ${e.SIT.length}</span> <span class="badge uat">UAT ${e.UAT.length}</span></div><ul>${[...e.SIT,...e.UAT].map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul></div>`}).join('');summary.scrollIntoView({behavior:'smooth',block:'start'})}
fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(data=>{document.getElementById('meta').innerHTML=`Last refresh: <b>${esc(data.refreshedAt.replace('T',' '))} WIB</b> · <a href="${esc(data.source)}" target="_blank" rel="noopener">Sumber Google Docs</a>`;document.getElementById('summary-button').addEventListener('click',()=>renderSummary(data.events));const dates=Object.keys(data.events).sort(), first=new Date(`${dates[0]}T00:00:00+07:00`), last=new Date(`${dates.at(-1)}T00:00:00+07:00`), root=document.getElementById('calendar');for(let cursor=new Date(first.getFullYear(),first.getMonth(),1);cursor<=last;cursor.setMonth(cursor.getMonth()+1)){const y=cursor.getFullYear(),m=cursor.getMonth(),section=document.createElement('section');section.className='month';section.innerHTML=`<h2>${monthFmt.format(new Date(y,m,1))}</h2><div class="week"><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div></div><div class="grid"></div>`;const grid=section.querySelector('.grid');const offset=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<offset;i++)grid.insertAdjacentHTML('beforeend','<div class="day muted"></div>');for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const date=iso(y,m,d),e=data.events[date],cell=document.createElement('button');cell.type='button';cell.className='day';cell.dataset.date=date;cell.innerHTML=`<span class="num">${d}</span>`+(e?`<div class="badges">${e.SIT.length?`<span class="badge sit">SIT ${e.SIT.length}</span>`:''}${e.UAT.length?`<span class="badge uat">UAT ${e.UAT.length}</span>`:''}</div>`:'');if(e)cell.addEventListener('click',()=>show(date,data.events));grid.appendChild(cell)}root.appendChild(section)}}).catch(e=>document.getElementById('calendar').innerHTML=`<p>Data kalender gagal dimuat: ${esc(e)}</p>`);
</script></body></html>
