<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalender SIT dan UAT Melawai Eye Care</title><style>body{font:15px/1.45 system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 18px;color:#1f2937}h1{margin-bottom:4px}.meta{color:#64748b}.legend{display:flex;gap:16px;margin:20px 0}.badge{color:#fff;border-radius:4px;padding:3px 7px;font-weight:700}.sit{background:#2563eb}.uat{background:#16a34a}.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{border:1px solid #dbe2ea;border-radius:8px;padding:14px;background:#fff}.card h2{font-size:18px;margin:0 0 8px}.card h3{font-size:14px;margin:12px 0 4px}.card ul{margin:4px 0;padding-left:20px}.empty{color:#64748b;font-style:italic}a{color:#2563eb}</style></head><body><h1>Kalender SIT dan UAT Melawai Eye Care</h1><p class="meta" id="meta">Memuat data terbaru...</p><div class="legend"><b class="badge sit">SIT</b><b class="badge uat">UAT</b></div><main class="dates" id="dates"></main><p><a href="detail.html">Lihat detail seluruh item</a></p><script>
const fmt=new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric',timeZone:'Asia/Jakarta'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{document.getElementById('meta').innerHTML=`Last refresh: <b>${esc(d.refreshedAt.replace('T',' '))} WIB</b> · <a href="${esc(d.source)}" target="_blank" rel="noopener">Sumber Google Docs</a>`;const root=document.getElementById('dates');Object.keys(d.events).sort().forEach(date=>{const e=d.events[date];let html=`<article class="card"><h2>${fmt.format(new Date(date+'T00:00:00+07:00'))}</h2>`;for(const kind of ['SIT','UAT']){html+=`<h3><span class="badge ${kind.toLowerCase()}">${kind} ${e[kind].length}</span></h3>`;html+=e[kind].length?`<ul>${e[kind].map(x=>`<li>${esc(x.label)}</li>`).join('')}</ul>`:'<div class="empty">Tidak ada jadwal</div>'}root.insertAdjacentHTML('beforeend',html+'</article>')})}).catch(e=>document.getElementById('dates').innerHTML=`<p>Data kalender gagal dimuat: ${esc(e)}</p>`);
</script></body></html>
